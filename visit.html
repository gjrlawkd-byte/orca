<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>오시는 길 · 퍼즐카페 오르카</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="퍼즐카페 오르카 주소, 영업시간, 주차, 연락처.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<link rel="stylesheet" href="assets/css/style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='16' fill='%23141414'/%3E%3Ctext x='16' y='22' font-family='Arial' font-weight='800' font-size='16' fill='%23fff' text-anchor='middle'%3EO%3C/text%3E%3C/svg%3E">
<meta name="theme-color" content="#F4F2F0">
<meta property="og:site_name" content="퍼즐카페 오르카">
<meta property="og:type" content="website">
<meta property="og:locale" content="ko_KR">
<meta property="og:title" content="오시는 길 · 퍼즐카페 오르카">
<meta property="og:description" content="퍼즐카페 오르카 주소, 영업시간, 주차, 연락처.">
<script>try{var t=localStorage.getItem("orca-theme");if(t)document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
</head>
<body data-page="visit">
<div id="site-header"></div>
<main id="main">
  <header class="page-head">
    <div class="wrap">
      <span class="crumb"><a href="index.html">Home</a> / Visit</span>
      <h1 class="h1 h-kr">오시는 길</h1>
      <p class="lede" data-render="today-status"></p>
    </div>
  </header>
  <section class="section">
    <div class="wrap visit-grid">
      <dl class="info-list">
        <div>
          <dt>Address</dt>
          <dd>
            <span id="addr"><span data-render="text" data-key="cafe.address"></span>, <span data-render="text" data-key="cafe.addressDetail"></span></span>
            <button class="copy-btn" type="button" data-copy="addr">주소 복사</button>
          </dd>
        </div>
        <div>
          <dt>Hours</dt>
          <dd>
            <div data-render="hours"></div>
            <span class="muted" style="font-size:var(--fs-sm)">라스트오더 <span class="num" data-render="text" data-key="cafe.lastOrder"></span></span>
          </dd>
        </div>
        <div>
          <dt>Parking</dt>
          <dd><span data-render="text" data-key="cafe.parking"></span><span class="muted" style="font-size:var(--fs-sm)">주차 등록은 카운터에서 도와드려요.</span></dd>
        </div>
        <div>
          <dt>Call</dt>
          <dd><span class="mono num" id="phone" data-render="text" data-key="cafe.phone"></span><button class="copy-btn" type="button" data-copy="phone">번호 복사</button></dd>
        </div>
        <div>
          <dt>Space</dt>
          <dd><span>단체석 · 테라스 · 2층 퍼즐 갤러리</span></dd>
        </div>
        <div>
          <dt>Instagram</dt>
          <dd data-render="insta"></dd>
        </div>
      </dl>
      <div style="display:grid;gap:16px">
        <div class="map-card">
          <svg viewBox="0 0 480 360" role="img" aria-labelledby="map-title">
            <title id="map-title">컨벤시아대로와 컨벤시아대로42번길 모퉁이의 코오롱 더 프라우 2단지 1층에 오르카가 있다는 개념 약도</title>
            <rect width="480" height="360" fill="var(--paper-2)"/>
            <g fill="var(--mat)" stroke="var(--rule)">
              <rect x="24" y="24" width="120" height="96"/>
              <rect x="24" y="148" width="120" height="76"/>
              <rect x="336" y="24" width="120" height="96"/>
              <rect x="336" y="148" width="120" height="76"/>
              <rect x="24" y="290" width="200" height="50"/>
              <rect x="256" y="290" width="200" height="50"/>
            </g>
            <rect x="0" y="244" width="480" height="30" fill="var(--mat)"/>
            <line x1="0" y1="259" x2="480" y2="259" stroke="var(--rule)" stroke-dasharray="10 8"/>
            <rect x="160" y="0" width="18" height="244" fill="var(--mat)"/>
            <rect x="178" y="40" width="142" height="186" fill="var(--paper)" stroke="var(--ink)" stroke-width="1.5"/>
            <text x="249" y="72" text-anchor="middle" font-family="IBM Plex Sans KR, sans-serif" font-size="12" font-weight="600" fill="var(--ink)">코오롱 더 프라우</text>
            <text x="249" y="90" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="10" fill="var(--ink-soft)">2단지 · 202동</text>
            <text x="12" y="238" font-family="IBM Plex Mono, monospace" font-size="10" letter-spacing="1" fill="var(--ink-soft)">컨벤시아대로</text>
            <text x="172" y="14" font-family="IBM Plex Mono, monospace" font-size="10" fill="var(--ink-soft)" transform="rotate(90 172 14)">42번길</text>
            <circle cx="232" cy="190" r="22" fill="var(--ocean)" opacity=".18"/>
            <circle cx="232" cy="190" r="9" fill="var(--ocean)"/>
            <circle cx="232" cy="190" r="3.5" fill="var(--mat)"/>
            <text x="250" y="186" font-family="Instrument Serif, serif" font-size="20" fill="var(--ink)">Orca</text>
            <text x="250" y="202" font-family="IBM Plex Mono, monospace" font-size="10" fill="var(--ink-soft)">1F · 퍼즐카페</text>
            <g transform="translate(436 300)" fill="var(--ink-soft)">
              <path d="M0 -18 L6 0 L0 -4 L-6 0Z"/>
              <text y="14" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="10">N</text>
            </g>
          </svg>
          <div class="map-links" data-render="maps"></div>
        </div>
      </div>
    </div>
  </section>
</main>
<div id="site-footer"></div>
<script src="assets/js/data.js"></script>
<script src="assets/js/site.js"></script>
<script src="assets/js/pages.js"></script>
</body>
</html>
